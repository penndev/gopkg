<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>otp · gopkg</title>
  <style>
    :root {
      --bg: #e8eef4;
      --ink: #1a2332;
      --muted: #5a6a7a;
      --accent: #0d6e6e;
      --panel: #f7fafc;
      --line: #c5d0db;
      --ok: #1b5e3b;
      --err: #8b2e2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #c8dde8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #d4e0d8 0%, transparent 50%),
        var(--bg);
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .nav { margin-bottom: 20px; font-size: 0.9rem; }
    .nav a { color: var(--accent); text-decoration: none; }

    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    .lead { margin: 0 0 28px; color: var(--muted); font-size: 0.95rem; }

    section {
      margin-bottom: 20px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    section h2 { margin: 0 0 14px; font-size: 1.05rem; color: var(--accent); }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    input {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: #fff;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .hint { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }
    .mono { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }

    .code {
      font-size: 2rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      margin: 8px 0;
    }

    .qr { display: block; margin: 12px auto; width: 200px; height: 200px; background: #fff; }

    .feedback { margin-top: 10px; min-height: 1.2em; font-size: 0.9rem; color: var(--muted); }
    .feedback.ok { color: var(--ok); }
    .feedback.err { color: var(--err); }
  </style>
</head>

<body>
  <main>
    <div class="nav"><a href="/">← gopkg</a></div>
    <h1>otp</h1>
    <p class="lead">TOTP 两步验证（RFC 6238）。生成密钥后可用 Google Authenticator 等扫码。</p>

    <section>
      <h2>1. 生成密钥</h2>
      <div class="row">
        <input id="issuer" type="text" value="gopkg" placeholder="issuer" />
        <input id="account" type="text" value="demo" placeholder="account" />
        <button type="button" id="btnNew">生成</button>
      </div>
      <p class="hint">密钥仅保存在本页，刷新即丢失。</p>
    </section>

    <section id="bind" hidden>
      <h2>2. 绑定</h2>
      <img class="qr" id="qr" alt="otpauth QR" />
      <p><strong>Secret</strong></p>
      <p class="mono" id="secret"></p>
      <p><strong>URI</strong></p>
      <p class="mono" id="uri"></p>
      <p><strong>当前码</strong>（剩余 <span id="remain">-</span>s）</p>
      <p class="code" id="liveCode">------</p>
    </section>

    <section id="verifyBox" hidden>
      <h2>3. 校验</h2>
      <div class="row">
        <input id="codeInput" type="text" maxlength="6" placeholder="6 位验证码" inputmode="numeric" />
        <button type="button" id="btnVerify">验证</button>
      </div>
      <div class="feedback" id="feedback">验证结果将显示在这里</div>
    </section>
  </main>

  <script>
    let secret = "";
    let timer = null;

    const $ = (id) => document.getElementById(id);

    async function refreshCode() {
      if (!secret) return;
      const res = await fetch("/otp/api/code?secret=" + encodeURIComponent(secret));
      const data = await res.json();
      if (data.error) return;
      $("liveCode").textContent = data.code;
      $("remain").textContent = data.remain;
    }

    $("btnNew").onclick = async () => {
      const body = new URLSearchParams({
        issuer: $("issuer").value.trim(),
        account: $("account").value.trim(),
      });
      const res = await fetch("/otp/api/new", { method: "POST", body });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      secret = data.secret;
      $("secret").textContent = data.secret;
      $("uri").textContent = data.uri;
      $("qr").src = data.qr;
      $("liveCode").textContent = data.code;
      $("remain").textContent = data.remain;
      $("bind").hidden = false;
      $("verifyBox").hidden = false;
      clearInterval(timer);
      timer = setInterval(refreshCode, 1000);
    };

    $("btnVerify").onclick = async () => {
      const body = new URLSearchParams({
        secret,
        code: $("codeInput").value.trim(),
      });
      const res = await fetch("/otp/api/verify", { method: "POST", body });
      const data = await res.json();
      const fb = $("feedback");
      if (data.error) {
        fb.className = "feedback err";
        fb.textContent = data.error;
        return;
      }
      fb.className = "feedback " + (data.ok ? "ok" : "err");
      fb.textContent = data.ok ? "验证成功" : "验证失败（当前应为 " + data.want + "）";
    };
  </script>
</body>

</html>
