<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>captcha · gopkg</title>
  <style>
    :root {
      --bg: #e8eef4;
      --ink: #1a2332;
      --muted: #5a6a7a;
      --accent: #0d6e6e;
      --accent-hover: #0a5555;
      --panel: #f7fafc;
      --line: #c5d0db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #c8dde8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #d4e0d8 0%, transparent 50%),
        var(--bg);
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .nav { margin-bottom: 20px; font-size: 0.9rem; }
    .nav a { color: var(--accent); text-decoration: none; }
    .nav a:hover { text-decoration: underline; }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 700;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      margin-bottom: 20px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      background: var(--panel);
      text-align: center;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .feedback {
      margin: 10px 0;
      min-height: 1.2em;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .submit-btn {
      width: 100%;
      padding: 10px 18px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover { background: var(--accent-hover); }

    .captcha-image {
      width: 100%;
      max-width: 280px;
      height: 100px;
      margin: 0 auto 16px;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .puzzle-container {
      width: 100%;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .tip {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 8px;
    }
  </style>
</head>

<body>
  <main>
    <p class="nav"><a href="/">← gopkg</a></p>
    <h1>captcha</h1>
    <p class="lead">图文验证码（captcha）与拼图验证码（captcha2）。</p>

    <div class="panel">
      <h2>图文验证码</h2>
      <div class="captcha-image"><img id="captchaTextImage" alt="图文验证码" /></div>
      <input type="text" class="input-field" placeholder="请输入验证码" id="captchaTextInput" />
      <div class="feedback" id="captchaTextText">验证结果将显示在这里</div>
      <button type="button" class="submit-btn" id="captchaTextSubmit">提交验证</button>
    </div>

    <div class="panel">
      <h2>拼图验证码</h2>
      <div class="puzzle-container">
        <div id="captcha2Image" style="position: relative;">
          <div id="captcha2Piece" style="position: absolute;"></div>
        </div>
      </div>
      <p class="tip">拖动拼图到缺口完成验证</p>
      <div class="feedback" id="captcha2Text">验证结果将显示在这里</div>
      <button type="button" class="submit-btn" id="captcha2Submit">提交验证</button>
    </div>
  </main>

  <script>
    let formTextID = "";
    const loadText = () => {
      fetch("/captcha/text").then((res) => res.json()).then((body) => {
        formTextID = body.ID;
        document.getElementById("captchaTextImage").src = body.PngBase64;
      });
    };
    loadText();
    document.getElementById("captchaTextSubmit").onclick = () => {
      const data = new FormData();
      data.append("id", formTextID);
      data.append("code", document.getElementById("captchaTextInput").value);
      fetch("/captcha/text", { method: "POST", body: data }).then((res) => res.text()).then((body) => {
        document.getElementById("captchaTextText").textContent = body;
        loadText();
      });
    };

    const captcha2Image = document.getElementById("captcha2Image");
    const captcha2Piece = document.getElementById("captcha2Piece");
    const captcha2Text = document.getElementById("captcha2Text");
    let dragging = false, offsetX = 0, offsetY = 0;
    let formId, formX = 0, formY = 0;

    function startDrag(e) {
      dragging = true;
      const point = e.touches ? e.touches[0] : e;
      const rect = captcha2Piece.getBoundingClientRect();
      offsetX = point.clientX - rect.left;
      offsetY = point.clientY - rect.top;
    }
    function moveDrag(e) {
      if (!dragging) return;
      const point = e.touches ? e.touches[0] : e;
      const rect = captcha2Image.getBoundingClientRect();
      let x = point.clientX - rect.left - offsetX;
      let y = point.clientY - rect.top - offsetY;
      formX = x = Math.ceil(Math.max(0, Math.min(rect.width - captcha2Piece.offsetWidth, x)));
      formY = y = Math.ceil(Math.max(0, Math.min(rect.height - captcha2Piece.offsetHeight, y)));
      captcha2Piece.style.left = x + "px";
      captcha2Piece.style.top = y + "px";
      captcha2Text.textContent = `X: ${x}, Y: ${y}`;
    }
    const endDrag = () => { dragging = false; };

    captcha2Piece.addEventListener("mousedown", startDrag);
    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("mouseup", endDrag);
    captcha2Piece.addEventListener("touchstart", startDrag, { passive: false });
    document.addEventListener("touchmove", moveDrag, { passive: false });
    document.addEventListener("touchend", endDrag);

    const loadPuzzle = () => {
      captcha2Piece.style.left = "0px";
      captcha2Piece.style.top = "0px";
      formX = formY = 0;
      fetch("/captcha/puzzle").then((res) => res.json()).then((body) => {
        formId = body.ID;
        captcha2Image.style.backgroundImage = `url('${body.ImageBase64}')`;
        captcha2Image.style.width = body.ImageWidth + "px";
        captcha2Image.style.height = body.ImageHeight + "px";
        captcha2Piece.style.backgroundImage = `url('${body.PieceBase64}')`;
        captcha2Piece.style.width = body.PieceWidth + "px";
        captcha2Piece.style.height = body.PieceHeight + "px";
      });
    };
    loadPuzzle();

    document.getElementById("captcha2Submit").onclick = () => {
      const data = new FormData();
      data.append("id", formId);
      data.append("x", formX);
      data.append("y", formY);
      fetch("/captcha/puzzle", { method: "POST", body: data }).then((res) => res.text()).then((body) => {
        captcha2Text.textContent = body;
        loadPuzzle();
      });
    };
  </script>
</body>

</html>
